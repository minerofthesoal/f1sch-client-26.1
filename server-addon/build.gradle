plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = "3.0.0"
group = "com.reachfly.serveraddon"

base {
    archivesName = "f1sch-server-addon"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.1"
    implementation "net.fabricmc:fabric-loader:0.18.6"
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.4+26.1.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Data Pack build task
tasks.register('buildDatapack', Zip) {
    description = 'Builds the f1sch Server Addon as a Minecraft data pack (ZIP)'
    group = 'build'
    from('datapack')
    archiveBaseName = 'f1sch-server-addon-datapack'
    archiveVersion = project.version
    archiveExtension = 'zip'
    destinationDirectory = file("${buildDir}/libs")
}

build.dependsOn buildDatapack

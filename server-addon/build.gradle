plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = "3.0.0"
group = "com.reachfly.serveraddon"

base {
    archivesName = "f1sch-server-addon"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.1"
    mappings loom.layered() {}
    modImplementation "net.fabricmc:fabric-loader:0.18.6"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.145.4+26.1.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Data Pack build task
tasks.register('buildDatapack', Zip) {
    description = 'Builds the f1sch Server Addon as a Minecraft data pack (ZIP)'
    group = 'build'
    from('datapack')
    archiveBaseName = 'f1sch-server-addon-datapack'
    archiveVersion = project.version
    archiveExtension = 'zip'
    destinationDirectory = layout.buildDirectory.dir("libs")
}

tasks.named('build') {
    dependsOn tasks.named('buildDatapack')
}
